appId: com.aniao.harness
productName: Aniao Harness
copyright: Copyright © 2026 Aniao

# 桌面安装器独立记录分发版本，不改动共享 SDK 包的版本。
extraMetadata:
   version: 0.80.26

releaseInfo:
   releaseNotes: |
      - 内置四项免费免密钥 MCP：右栏浏览器、网页搜索、技术文档和 GitHub 公开仓库。
      - 支持模型在右侧栏读取网页、填写、点击、滚动、截图与切换多个标签。
      - 切换会话和收起侧栏时保留网页状态，后台操作不抢占当前会话。
      - 修复 MCP 多会话同步、连接状态与含空格参数，新增重新连接入口。

directories:
   output: release

# Windows 与 Linux 分别读取自己的更新清单。
publish:
   provider: generic
   url: http://117.72.245.101/downloads/updates/win/

# 只发布构建产物；生产依赖由 electron-builder 自动收集。
files:
   - dist/**
   - package.json
   - "!**/*.map"

# SDK 资源不随 asar 打包，安装后位于 resources/sdk，供 PI_PACKAGE_DIR 使用。
extraResources:
   - from: node_modules/@earendil-works/pi-coding-agent/package.json
     to: sdk/package.json
   - from: node_modules/@earendil-works/pi-coding-agent/dist/modes/interactive/theme
     to: sdk/dist/modes/interactive/theme
   - from: node_modules/@earendil-works/pi-coding-agent/dist/modes/interactive/assets
     to: sdk/dist/modes/interactive/assets
   - from: build/default-provider.json
     to: defaults/provider.json

asar: true
# 宿主以 ESM 运行，原生模块和独立入口放到 asar 外，避免 asar 内解析差异。
asarUnpack:
   - dist/main/**
   - "**/*.node"
   - "**/node-pty/**"

# Windows 使用预编译模块；Linux 在打包前单独编译并验证 node-pty。
npmRebuild: false

# 网络受限时从镜像下载 Electron；可用 ELECTRON_MIRROR 覆盖。
electronDownload:
   mirror: https://npmmirror.com/mirrors/electron/

win:
   target:
      - target: nsis
        arch:
           - x64
   artifactName: Aniao-Harness-${version}-windows-${arch}-setup.${ext}

linux:
   target:
      - target: deb
        arch:
           - x64
   executableName: aniao-harness
   syncDesktopName: true
   category: Development
   maintainer: Aniao
   artifactName: Aniao-Harness-${version}-linux-amd64.${ext}
   publish:
      provider: generic
      url: http://117.72.245.101/downloads/updates/linux/x64/

deb:
   packageName: aniao-harness
   recommends: []
   depends:
      - libc6 (>= 2.34)
      - libstdc++6
      - libgtk-3-0
      - libnotify4
      - libnss3
      - libxss1
      - libxtst6
      - xdg-utils
      - libatspi2.0-0
      - libuuid1
      - libsecret-1-0
      - libgbm1
      - libasound2 | libasound2t64

nsis:
   oneClick: false
   perMachine: false
   allowElevation: true
   allowToChangeInstallationDirectory: true
   createDesktopShortcut: true
   createStartMenuShortcut: true
   shortcutName: Aniao Harness
   uninstallDisplayName: Aniao Harness
   deleteAppDataOnUninstall: false
